# picom, the compositor of EXWM (exwm/start-exwm.sh), linked from
# ~/.config/picom/picom.conf by setup.sh.
#
# The applications (qutebrowser, mpv, ...) are their own X windows, laid over
# the Emacs windows by EXWM: they get rounded corners, and glide to their
# place when the windows are split or rearranged.  Emacs's frames, one a
# monitor, are see-through (alpha-background in anthe-transparency.el), the
# wallpaper blurred behind them; their own windows are drawn by Emacs, out of
# picom's reach.
#
# Back to the old compositor: ~/.cache/anthe-compositor (exwm/start-exwm.sh), or
# SPC k t o from Emacs for this session.

backend = "glx";
vsync = true;

# Behind what is see-through, the wallpaper blurred
blur: {
  method = "dual_kawase";
  strength = 4;
};
blur-background-fixed = false;

corner-radius = 10;
shadow = false;
fading = false;

# The applications glide to their new place and size
animations = ({
  triggers = [ "geometry" ];
  preset = "geometry-change";
  duration = 0.18;
});

rules: ({
  # Emacs's frames cover their monitor, in EXWM's frame containers: square,
  # and they don't glide when a monitor is plugged in
  match = "class_g = 'Emacs' || name ^= 'EXWM workspace'";
  corner-radius = 0;
  animations = ();
}, {
  # Their top bar less see-through (emacs-bar.frag)
  match = "name ^= 'EXWM workspace'";
  shader = "emacs-bar.frag";
}, {
  # The floating applications (EXWM lets them move): square, as the Emacs
  # frame around them
  match = "_NET_WM_ALLOWED_ACTIONS@[*] = '_NET_WM_ACTION_MOVE'";
  corner-radius = 0;
}, {
  # Whatever covers a monitor or the screen: square, still (the lock, the
  # loading screen, a fullscreen video)
  match = "fullscreen || class_g = 'i3lock' || class_g = 'anthe-splash'";
  corner-radius = 0;
  animations = ();
}, {
  match = "window_type = 'tooltip' || window_type = 'menu' || "
          "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
          "window_type = 'dnd'";
  corner-radius = 6;
  animations = ();
}, {
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
  blur-background = false;
})
