# khard: command-line address book over the vCard folder synced by vdirsyncer
# (~/documents/contacts, see ~/.config/vdirsyncer/config).

[addressbooks]
[[contacts]]
path = ~/documents/contacts/66d789c6-a165-408a-a658-5ed3d7170583/

[general]
default_action = list
editor = emacsclient
merge_editor = emacsclient

[contact table]
display = formatted_name
sort = last_name
show_uids = no
preferred_email_address_type = pref, work, home

[vcard]
# Version 3.0 is what Infomaniak and Android (DAVx5) handle best
preferred_version = 3.0
private_objects = Jabber, Skype, Twitter
search_in_source_files = no
skip_unparsable = yes
