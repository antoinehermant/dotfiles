# tmux on UBELIX (bin/hpc-session): my work session, which stays when I
# disconnect. Night Owl colours. Prefix C-b; C-b | and C-b - split here,
# C-b h/j/k/l move between panes, C-b [ copies with vi keys (to the laptop's
# clipboard, OSC 52).

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"
set -sg escape-time 10          # Esc at once, for Neovim and Evil
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi
# A new connection's X display, for ncview and Emacs's windows (the shells
# read it again at each prompt: bash/.bash_hpc)
set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_CONNECTION XAUTHORITY"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Night Owl
set -g status-style "bg=#011627,fg=#d6deeb"
set -g status-left "#[fg=#011627,bg=#c792ea,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#7fdbca]#h #[fg=#82aaff]%H:%M "
setw -g window-status-format "#[fg=#5f7e97] #I #W "
setw -g window-status-current-format "#[fg=#011627,bg=#82aaff,bold] #I #W "
set -g pane-border-style "fg=#1d3b53"
set -g pane-active-border-style "fg=#7fdbca"
set -g message-style "bg=#0b2942,fg=#ecc48d"
setw -g mode-style "bg=#1d3b53,fg=#d6deeb"
